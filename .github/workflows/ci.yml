name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Safe placeholders: the app validates its environment at import time, so the
  # build and the tests need every variable to be *present and parseable*.
  # APP_URL is localhost, which is what permits the development drivers.
  APP_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  SESSION_SECRET: ci-session-secret-at-least-32-characters-long
  PAYMENT_PROVIDER: fake
  STORAGE_DRIVER: local
  EMAIL_DRIVER: console
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jewels_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jewels_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jewels_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Apply migrations
        run: pnpm exec prisma migrate deploy

      - name: Test
        run: pnpm exec vitest run

      - name: Audit dependencies
        # Advisories appear between builds, so this must not be able to fail a
        # release of code that did not change. It reports and moves on; the
        # signal is the annotation, not a red build.
        continue-on-error: true
        run: pnpm audit --audit-level=moderate

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: verify

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jewels_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jewels_e2e?schema=public
      APP_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
      SEED_ADMIN_EMAIL: admin@aurelia.test
      SEED_ADMIN_PASSWORD: Admin!2345
      SEED_CUSTOMER_EMAIL: customer@aurelia.test
      SEED_CUSTOMER_PASSWORD: Customer!2345

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - name: Prepare database
        run: |
          pnpm exec prisma migrate deploy
          pnpm db:seed

      - name: Build
        run: pnpm build

      - name: Run end-to-end tests
        # Both projects. The `mobile` project (Pixel 7) runs on the same
        # Chromium binary, and leaving it out of CI is how the mobile-only
        # failures this suite now covers went unnoticed in the first place.
        run: pnpm exec playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
